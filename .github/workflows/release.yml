name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip packs
        run: |
          mkdir out
          (cd NecoVanilla && zip -q -r -X ../out/NecoVanilla.zip .)
          (cd CustomPortals && zip -q -r -X ../out/CustomPortals-pack.zip .)
          sha1sum out/*.zip > out/sha1.txt
          cat out/sha1.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pack-${{ github.run_number }}"
          gh release create "$tag" out/NecoVanilla.zip out/CustomPortals-pack.zip out/sha1.txt \
            --target "${{ github.sha }}" --title "$tag" --notes "$(git log -1 --format=%s)" --latest
